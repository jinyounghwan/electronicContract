<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <!-- 공통 헤드 -->
    <th:block th:replace="~{layout/fragments/head :: headFragment}"></th:block>
    <th:block layout:fragment="css"></th:block>
    <style>
    /* Dimmed Background */
    #overlay {
        display: none; /* 초기에는 숨김 */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* 반투명 검정색 */
        z-index: 9998; /* 프로그레스 바보다 아래에 위치 */
    }

    #progressBar {
        position: fixed;
        top: calc(50% - 15px); /* 50%에서 높이의 절반(15px)만큼 위로 이동 */
        left: 50%; /* 화면의 중앙에 위치 */
        transform: translate(-50%, 0); /* 수평으로 중앙 정렬 */
        z-index: 9999; /* 다른 요소 위에 나타나게 함 */
        width: 300px; /* 너비 조정 */
    }
</style>
<body>
    <!-- 상단바 -->
    <header th:replace="~{layout/fragments/header :: headerFragment}"></header>
    <div id="top-wrapper">
        <!-- 사이드바 -->
        <th:block th:replace="~{layout/fragments/left :: sidebarFragment}"></th:block>

        <!-- content fragment 사용 -->
        <th:block layout:fragment="content"></th:block>
    </div>
    <!-- 공통 하단 -->
    <th:block th:replace="~{layout/fragments/footer :: footerFragment}"></th:block>

    <!-- script fragment 사용 -->
    <th:block layout:fragment="script"></th:block>
    <div id="overlay"></div> <!-- Dimmed Background -->
    <!-- Progress Bar -->
    <div id="progressBar" style="display: none;">
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%;">Loading...</div>
        </div>
    </div>
</body>
</html>
